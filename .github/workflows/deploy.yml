name: Build & Deploy to GCP Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: madhav-test-471011
  REGION: asia-south1
  BACKEND_SERVICE: english-ai-backend
  FRONTEND_SERVICE: english-ai-frontend
  REGISTRY: asia-south1-docker.pkg.dev
  FIREBASE_PROJECT: madhav-test-471011-c1d58

jobs:
  # ── 1. Backend — Build & Deploy ──────────────────────────
  deploy-backend:
    name: Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create Artifact Registry repo if not exists
        run: |
          gcloud artifacts repositories describe english-ai \
            --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} 2>/dev/null \
          || gcloud artifacts repositories create english-ai \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push Backend image
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/english-ai/${{ env.BACKEND_SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE ./backend
          docker push $IMAGE

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy ${{ env.BACKEND_SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/english-ai/${{ env.BACKEND_SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --set-env-vars="GEMINI_USE_VERTEX=true,GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }},VERTEX_LOCATION=global,GEMINI_MODEL=gemini-flash-lite-latest,FIREBASE_PROJECT=${{ env.FIREBASE_PROJECT }},ALLOWED_EMAILS=sakemadhav97@gmail.com" \
            --timeout=900 \
            --project=${{ env.PROJECT_ID }}

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.BACKEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Backend: $URL"

    outputs:
      backend_url: ${{ steps.backend-url.outputs.url }}

  # ── 2. Frontend — Build & Deploy ─────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Cloud Run
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push Frontend image
        env:
          # Firebase web config — repo Variable or Secret named FIREBASE_CONFIG
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG || secrets.FIREBASE_CONFIG }}
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/english-ai/${{ env.FRONTEND_SERVICE }}:${{ github.sha }}
          docker build \
            --build-arg REACT_APP_API_URL=${{ needs.deploy-backend.outputs.backend_url }} \
            --build-arg REACT_APP_FIREBASE_CONFIG="$FIREBASE_CONFIG" \
            -t $IMAGE ./frontend
          docker push $IMAGE

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy ${{ env.FRONTEND_SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/english-ai/${{ env.FRONTEND_SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=80 \
            --memory=256Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --project=${{ env.PROJECT_ID }}

      - name: 🎉 Print URLs
        run: |
          URL=$(gcloud run services describe ${{ env.FRONTEND_SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)")
          echo "🎉 Frontend: $URL"
          echo "### 🚀 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Service | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 🌐 Frontend | [$URL]($URL) |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚙️ Backend | [${{ needs.deploy-backend.outputs.backend_url }}](${{ needs.deploy-backend.outputs.backend_url }}) |" >> $GITHUB_STEP_SUMMARY

  # ── 3. Firestore security rules (from firestore.rules) ───
  deploy-firestore-rules:
    name: Deploy Firestore rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP (Keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Publish rules
        run: |
          set -euo pipefail
          API=https://firebaserules.googleapis.com/v1/projects/${{ env.FIREBASE_PROJECT }}
          TOKEN=$(gcloud auth print-access-token)
          BODY=$(jq -n --rawfile src firestore.rules '{source:{files:[{name:"firestore.rules",content:$src}]}}')
          RULESET=$(curl -sS --fail-with-body -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$BODY" | jq -r .name)
          echo "Created $RULESET"
          curl -sS --fail-with-body -X PATCH "$API/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"release\":{\"name\":\"projects/${{ env.FIREBASE_PROJECT }}/releases/cloud.firestore\",\"rulesetName\":\"$RULESET\"}}"
          echo "✅ Firestore rules published"
